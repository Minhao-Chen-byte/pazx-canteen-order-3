name: 自动订餐

on:
  schedule:
    # 每日 13:51 北京时间 (05:51 UTC) 启动
    - cron: '51 5 * * *'
  workflow_dispatch:  # 手动触发

concurrency:
  group: auto-order
  cancel-in-progress: false

jobs:
  order-meal:
    runs-on: ubuntu-latest
    timeout-minutes: 80  # 13:51~15:00 = 70分钟 + 缓冲

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 写入配置
        env:
          CFG_KEYWORDS: ${{ secrets.KEYWORDS }}
          CFG_EXCLUDE: ${{ secrets.EXCLUDE_KEYWORDS }}
          CFG_BF_FIRST: ${{ secrets.BREAKFAST_FIRST }}
          CFG_BF_SECOND: ${{ secrets.BREAKFAST_SECOND }}
          CFG_BF_THIRD: ${{ secrets.BREAKFAST_THIRD }}
          CFG_LU_FIRST: ${{ secrets.LUNCH_FIRST }}
          CFG_LU_SECOND: ${{ secrets.LUNCH_SECOND }}
          CFG_LU_THIRD: ${{ secrets.LUNCH_THIRD }}
          CFG_DN_FIRST: ${{ secrets.DINNER_FIRST }}
          CFG_DN_SECOND: ${{ secrets.DINNER_SECOND }}
          CFG_DN_THIRD: ${{ secrets.DINNER_THIRD }}
          CFG_AI_KEY: ${{ secrets.AI_API_KEY }}
        run: python .github/scripts/write_config.py

      - name: 订餐循环（13:51 → 15:00，每 10 分钟一次）
        env:
          CANTEEN_USERNAME: ${{ secrets.CANTEEN_USERNAME }}
          CANTEEN_PASSWORD: ${{ secrets.CANTEEN_PASSWORD }}
          CANTEEN_G_ID: ${{ secrets.CANTEEN_G_ID }}
          CANTEEN_NAME: ${{ secrets.CANTEEN_NAME }}
          CANTEEN_USERNAME_2: ${{ secrets.CANTEEN_USERNAME_2 }}
          CANTEEN_PASSWORD_2: ${{ secrets.CANTEEN_PASSWORD_2 }}
          CANTEEN_G_ID_2: ${{ secrets.CANTEEN_G_ID_2 }}
          CANTEEN_NAME_2: ${{ secrets.CANTEEN_NAME_2 }}
          CANTEEN_USERNAME_3: ${{ secrets.CANTEEN_USERNAME_3 }}
          CANTEEN_PASSWORD_3: ${{ secrets.CANTEEN_PASSWORD_3 }}
          CANTEEN_G_ID_3: ${{ secrets.CANTEEN_G_ID_3 }}
          CANTEEN_NAME_3: ${{ secrets.CANTEEN_NAME_3 }}
        run: |
          # 北京时间 15:00 = UTC 07:00
          END_TIME=$(date -d "today 07:00 UTC" +%s)
          NOW_TS=$(date +%s)
          # 非窗口期（手动触发/cron延迟）：只执行一次，不等待
          OUTSIDE_WINDOW=false
          if [ $NOW_TS -ge $END_TIME ]; then
            OUTSIDE_WINDOW=true
            END_TIME=$((NOW_TS + 60))
            echo "[注意] 当前不在订餐窗口内（13:51-15:00 北京时间），执行一次检查"
          fi

          CYCLE=0
          while [ $(date +%s) -lt $END_TIME ]; do
            CYCLE=$((CYCLE + 1))
            echo ""
            echo "=============================================="
            echo "  第 $CYCLE 次订餐检查  $(date '+%Y-%m-%d %H:%M:%S')"
            echo "  (北京时间 13:51-15:00)"
            echo "=============================================="

            python auto_order_daemon.py --all

            # 非窗口期只跑一次就退出
            if [ "$OUTSIDE_WINDOW" = true ]; then
              break
            fi

            NOW_TS=$(date +%s)
            if [ $NOW_TS -lt $END_TIME ]; then
              REMAIN=$(( (END_TIME - NOW_TS) / 60 ))
              if [ $REMAIN -gt 0 ]; then
                echo ""
                echo "[等待] 10 分钟后下次检查（剩余约 ${REMAIN} 分钟）"
                sleep 600
              else
                break
              fi
            fi
          done

          echo ""
          echo "=============================================="
          echo "  今日订餐窗口结束 (15:00)，明天 13:51 继续"
          echo "=============================================="
